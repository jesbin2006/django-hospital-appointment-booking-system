{% extends 'base.html' %}

{% block title %}
Email Sent
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 rounded-4 p-5 text-center">

                <div class="mb-4">
                    <i class="fa-solid fa-envelope-circle-check text-success" style="font-size:70px;"></i>
                </div>

                <h2 class="fw-bold mb-3">
                    Check Your Email 📩
                </h2>

                <p class="text-muted">
                    We have sent a password reset link to your email address.
                </p>

                <a href="{% url 'home' %}" class="btn btn-primary mt-3 px-4 rounded-3">
                    Back Home
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
