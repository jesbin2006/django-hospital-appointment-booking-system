{% extends 'base.html' %}
{% load static %}
{% block title %}
Departments
{% endblock %}

{% block content %}
<section id="departments" class="departments section">

  <!-- Section Title -->
  <div class="container section-title" data-aos="fade-up">
    <h2>Departments</h2>
    <p>Explore our medical departments</p>
  </div>

  <div class="container">

    <div class="row gy-4">

      {% for i in departlevel %}

      <div class="col-lg-6" data-aos="fade-up">

        <div class="card border-0 shadow-sm h-100 p-3">

          <img src="{{ i.image.url }}"
               class="img-fluid rounded mb-3"
               alt="{{ i.name }}">

          <h3>{{ i.name }}</h3>

          <p class="text-muted">
            {{ i.description }}
          </p>

          <a href="{% url 'see_doctors' i.id %}" class="btn btn-primary mt-2">
            View Doctors
          </a>

        </div>

      </div>

      {% endfor %}

    </div>

  </div>

</section>
{% endblock %}
