{% extends 'base.html' %}

{% block title %}
Set New Password
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 rounded-4 p-4">

                <div class="text-center mb-4">
                    <h2 class="fw-bold">Set New Password</h2>
                    <p class="text-muted">
                        Enter your new secure password.
                    </p>
                </div>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-success w-100 py-2 rounded-3">
                        Change Password
                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
