  <form method="POST" class="php-email-form p-5 shadow rounded bg-white">

                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="mb-2">Full Name</label>
                        {{ form.name }}
                    </div>

                    <div class="mb-3">
                        <label class="mb-2">Username</label>
                        {{ form.username }}
                    </div>

                    <div class="mb-3">
                        <label class="mb-2">Email Address</label>
                        {{ form.email }}
                    </div>

                    <div class="mb-3">
                        <label class="mb-2">Phone Number</label>
                        {{ form.phone }}
                    </div>

                    <div class="mb-3">
                        <label class="mb-2">Age</label>
                        {{ form.age }}
                    </div>

                    <div class="mb-3">
                        <label class="mb-2">Password</label>
                        {{ form.password }}
                    </div>

                    <div class="mb-3">
                        <label class="mb-2">Address</label>
                        {{ form.address }}
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit">
                            Register
                        </button>
                    </div>

                </form>

             <form method="POST" class="p-5 shadow rounded bg-white">
    {% csrf_token %}

    {{ form.as_p }}

    <div class="text-center mt-4">
        <button type="submit" class="btn btn-primary">
            Register
        </button>
    </div>
     </form>
