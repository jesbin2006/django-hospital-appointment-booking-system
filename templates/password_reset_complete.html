{% extends 'base.html' %}

{% block title %}
Password Changed
{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <div class="col-md-5">

            <div class="card shadow-lg border-0 rounded-4 p-5 text-center">

                <div class="mb-4">
                    <i class="fa-solid fa-circle-check text-success" style="font-size:70px;"></i>
                </div>

                <h2 class="fw-bold mb-3">
                    Password Changed Successfully ✅
                </h2>

                <p class="text-muted">
                    Your account password has been updated successfully.
                </p>

                <a href="{% url 'go_login_otp' %}" class="btn btn-primary mt-3 px-4 rounded-3">
                    Login Now
                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
