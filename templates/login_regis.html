{% extends 'base.html' %}
{% load static %}

{% block title %}
User Registration
{% endblock %}

{% block content %}

<section class="appointment section">

    <div class="container">

        <div class="section-title">
            <h2>sign-up</h2>
            <p>Create Your Account</p>
        </div>

        <div class="row justify-content-center">

            <div class="col-lg-7">

             <form method="POST" class="p-5 shadow rounded bg-white">
                {% csrf_token %}

               {{ form.as_p }}

            <div class="text-center mt-4">
              <button type="submit" class="btn btn-primary">
                Register
             </button>
              </div>
            </form>
            </div>

        </div>

    </div>

</section>

{% endblock %}
